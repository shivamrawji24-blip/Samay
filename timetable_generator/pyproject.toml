[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-timetable-generator"
version = "1.0.0"
description = "AI-based college timetable generation with CSP and local search"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.35", "pandas>=2.0", "matplotlib>=3.7", "reportlab>=4.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["timetable_generator/tests"]
